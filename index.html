<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>漢字筆順守衛戰 - 墨斬水鄉 (香港小學中文默書防線)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ink-slash-game';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        let auth, db, currentUser = null;

        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            async function initAuth() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        const userCred = await signInWithCustomToken(auth, __initial_auth_token);
                        currentUser = userCred.user;
                    } else {
                        const userCred = await signInAnonymously(auth);
                        currentUser = userCred.user;
                    }
                    if (window.loadCloudData) window.loadCloudData();
                } catch (e) {
                    console.error("Firebase auth error:", e);
                }
            }
            initAuth();
        }

        window.saveCloudDataToSlot = async function(slotNumber, customTitle) {
            const currentWords = document.getElementById('parentCustomInput')?.value.trim() || "";
            const slotName = customTitle || `存檔槽 ${slotNumber}`;

            if (!currentWords) {
                if (window.showToast) window.showToast("⚠️ 請先喺框內輸入要儲存嘅字！");
                return;
            }

            let localSlots = JSON.parse(localStorage.getItem('ink_slash_save_slots') || '{}');
            localSlots[slotNumber] = { title: slotName, words: currentWords, date: new Date().toLocaleDateString() };
            localStorage.setItem('ink_slash_save_slots', JSON.stringify(localSlots));
            localStorage.setItem('ink_slash_last_words', currentWords);

            if (window.renderSaveSlotsList) window.renderSaveSlotsList();
            if (window.showToast) window.showToast(`💾 已成功儲存至「${slotName}」！`);

            if (db && currentUser) {
                try {
                    const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'saveData', 'slots');
                    await setDoc(userDocRef, { slots: localSlots, updatedAt: Date.now() }, { merge: true });
                } catch (err) {
                    console.error("Cloud Slot Save error:", err);
                }
            }
        };

        window.loadCloudData = async function() {
            const lastWords = localStorage.getItem('ink_slash_last_words');
            if (lastWords && document.getElementById('parentCustomInput')) {
                document.getElementById('parentCustomInput').value = lastWords;
            }
            if (window.renderSaveSlotsList) window.renderSaveSlotsList();

            if (!db || !currentUser) return;
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'saveData', 'slots');
                const docSnap = await getDoc(userDocRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.slots) {
                        localStorage.setItem('ink_slash_save_slots', JSON.stringify(data.slots));
                        if (window.renderSaveSlotsList) window.renderSaveSlotsList();
                    }
                }
            } catch (err) {
                console.error("Cloud Load error:", err);
            }
        };
    </script>

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }
        body, html {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #080c14;
            color: #f1f5f9;
            overflow-x: hidden;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            -webkit-overflow-scrolling: touch;
        }
        .font-calligraphy { 
            font-family: 'Noto Serif TC', serif; 
            font-weight: 900;
        }
        .glow-gold { text-shadow: 0 0 14px rgba(245, 158, 11, 0.95), 0 0 35px rgba(217, 119, 6, 0.85); }

        .ink-card {
            border: 2px solid rgba(245, 158, 11, 0.5);
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.95);
        }

        @keyframes slashAttack {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            30% { transform: scale(1.18) translate(40px, -15px) rotate(8deg); filter: brightness(1.6) drop-shadow(0 0 25px #f59e0b); }
            60% { transform: scale(1.08) translate(15px, 0px) rotate(-3deg); filter: brightness(1.3); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        }

        @keyframes hitEnemy {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            20% { transform: scale(0.9) translate(-30px, 10px) rotate(-15deg); filter: brightness(3) sepia(1) hue-rotate(-50deg); }
            50% { transform: scale(1.15) translate(40px, -40px) rotate(25deg); opacity: 0.8; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
        }

        .slash-anim { animation: slashAttack 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .hit-anim { animation: hitEnemy 0.65s cubic-bezier(0.25, 1, 0.5, 1); }

        .character-frame {
            position: relative;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 3px solid #f59e0b;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(245, 158, 11, 0.2);
            border-radius: 20px;
            overflow: hidden;
        }

        #dictationCanvas, #hanziWriterTarget {
            touch-action: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.8); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #fbbf24; }

        input, textarea {
            user-select: text !important;
            -webkit-user-select: text !important;
        }
    </style>
</head>
<body class="relative flex items-center justify-center overflow-x-hidden">

            const shuffled = [...poolArray].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function warmUpSpeech() {
            if (!speechWarmedUp && 'speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0;
                window.speechSynthesis.speak(u);
                speechWarmedUp = true;
            }
        }

        window.speakCantonese = function(text) {
            if (!text) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.88;
                window.speechSynthesis.speak(utterance);
            }
        };

        function initDictationCanvas() {
            const canvas = document.getElementById('dictationCanvas');
            if (!canvas) return;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = 250 * dpr;
            canvas.height = 250 * dpr;
            
            dictationCtx = canvas.getContext('2d', { willReadFrequently: true });
            dictationCtx.scale(dpr, dpr);

            clearDictationCanvas();

            canvas.onpointerdown = null;
            canvas.onpointermove = null;
            canvas.onpointerup = null;

            canvas.addEventListener('pointerdown', startDictationStroke, { passive: false });
            canvas.addEventListener('pointermove', drawDictationStroke, { passive: false });
            canvas.addEventListener('pointerup', endDictationStroke, { passive: false });
            canvas.addEventListener('pointercancel', endDictationStroke, { passive: false });
        }

        function clearDictationCanvas() {
            if (dictationCtx) {
                dictationCtx.clearRect(0, 0, 250, 250);
            }
            strokeHistory = [];
        }

        function getCanvasCoordinates(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = 250 / rect.width;
            const scaleY = 250 / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function startDictationStroke(e) {
            isDrawing = true;
            const canvas = document.getElementById('dictationCanvas');
            const coords = getCanvasCoordinates(e, canvas);

            dictationCtx.strokeStyle = "#38bdf8"; 
            dictationCtx.lineWidth = 12;
            dictationCtx.lineCap = "round";
            dictationCtx.lineJoin = "round";
            dictationCtx.beginPath();
            dictationCtx.moveTo(coords.x, coords.y);

            strokeHistory.push([{ x: coords.x, y: coords.y }]);
            if (e.cancelable) e.preventDefault();
        }

        function drawDictationStroke(e) {
            if (!isDrawing || !dictationCtx) return;
            const canvas = document.getElementById('dictationCanvas');
            const coords = getCanvasCoordinates(e, canvas);

            dictationCtx.lineTo(coords.x, coords.y);
            dictationCtx.stroke();

            const currentStroke = strokeHistory[strokeHistory.length - 1];
            if (currentStroke) {
                currentStroke.push({ x: coords.x, y: coords.y });
            }
            if (e.cancelable) e.preventDefault();
        }

        function endDictationStroke(e) {
            isDrawing = false;
        }

        function initHanziWriter(char) {
            const writerTarget = document.getElementById('hanziWriterTarget');
            const dictationCanvas = document.getElementById('dictationCanvas');
            const copybookRefBox = document.getElementById('copybookReferenceBox');
            const copybookRefChar = document.getElementById('copybookRefChar');
            const loadingSpinner = document.getElementById('charLoadingSpinner');
            
            if (!writerTarget) return;
            writerTarget.innerHTML = '';
            clearDictationCanvas();

            // Local Jyutping fetch
            const localJp = hkJyutpingDict[char] || '---';
            document.getElementById('jyutpingText').textContent = localJp;

            // Auto Cantonese Speech
            speakCantonese(char);

            loadingSpinner.classList.remove('hidden');

            if (currentLearningMode === 'GUIDED') {
                dictationCanvas.classList.add('hidden');
                copybookRefBox.classList.add('hidden');
                document.getElementById('eraserBtn').classList.add('hidden');
                document.getElementById('submitQuizBtn').classList.add('hidden');
                document.getElementById('animateBtn').classList.remove('hidden');

                document.getElementById('targetCharTitle').textContent = char;

                writer = HanziWriter.create('hanziWriterTarget', char, {
                    width: 250, height: 250, padding: 8,
                    showOutline: true, showCharacter: false,
                    strokeAnimationSpeed: 1.5,
                    strokeColor: '#f59e0b',
                    outlineColor: 'rgba(245, 158, 11, 0.25)',
                    drawingColor: '#38bdf8',
                    strokeTolerance: 0.25,
                    onLoadCharDataSuccess: () => loadingSpinner.classList.add('hidden'),
                    onLoadCharDataError: () => {
                        loadingSpinner.classList.add('hidden');
                        window.showToast("⚠️ 字形數據載入失敗，請檢察網絡");
                    }
                });

                writer.quiz({
                    onMistake: function() {
                        combo = 0;
                        hp = Math.max(0, hp - 8);
                        window.showToast("⚠️ 筆順錯誤，請留意正確筆順！");
                        if (hp <= 0) endGame(false);
                    },
                    onCorrectStroke: function() {
                        combo++;
                        maxCombo = Math.max(maxCombo, combo);
                        score += 50 * combo;
                    },
                    onComplete: function() {
                        triggerSlashAnimation(() => {
                            score += 200;
                            currentWordIndex++;
                            if (currentWordIndex >= wordBank.length) endGame(true);
                            else loadCurrentCharacter();
                        });
                    }
                });
            } else if (currentLearningMode === 'COPYBOOK') {
                dictationCanvas.classList.remove('hidden');
                copybookRefBox.classList.remove('hidden');
                copybookRefChar.textContent = char;

                document.getElementById('eraserBtn').classList.remove('hidden');
                document.getElementById('animateBtn').classList.add('hidden');
                
                const submitBtn = document.getElementById('submitQuizBtn');
                submitBtn.classList.remove('hidden');
                submitBtn.innerHTML = currentWordIndex === wordBank.length - 1 ? "<span>交卷完成 ✅</span>" : "<span>揮刀 (下一字) ➡️</span>";

                document.getElementById('targetCharTitle').textContent = char;
                initDictationCanvas();

                writer = HanziWriter.create('hanziWriterTarget', char, {
                    width: 250, height: 250, padding: 8,
                    showOutline: false, showCharacter: false, drawingColor: 'rgba(0,0,0,0)',
                    onLoadCharDataSuccess: () => loadingSpinner.classList.add('hidden'),
                    onLoadCharDataError: () => loadingSpinner.classList.add('hidden')
                });
            } else {
                // QUIZ Mode
                dictationCanvas.classList.remove('hidden');
                copybookRefBox.classList.add('hidden');

                document.getElementById('eraserBtn').classList.remove('hidden');
                document.getElementById('animateBtn').classList.add('hidden');
                
                const submitBtn = document.getElementById('submitQuizBtn');
                submitBtn.classList.remove('hidden');
                submitBtn.innerHTML = currentWordIndex === wordBank.length - 1 ? "<span>交卷完成 ✅</span>" : "<span>揮刀 (下一字) ➡️</span>";

                document.getElementById('targetCharTitle').textContent = "？";
                initDictationCanvas();

                writer = HanziWriter.create('hanziWriterTarget', char, {
                    width: 250, height: 250, padding: 8,
                    showOutline: false, showCharacter: false, drawingColor: 'rgba(0,0,0,0)',
                    onLoadCharDataSuccess: () => loadingSpinner.classList.add('hidden'),
                    onLoadCharDataError: () => loadingSpinner.classList.add('hidden')
                });
            }

            updateEnemyUI();
        }

        function updateEnemyUI() {
            const enemyImgEl = document.getElementById('enemyImgEl');
            const enemyIcon = document.getElementById('enemyIcon');
            const enemyNameTag = document.getElementById('enemyNameTag');

            if (customEnemyImageBase64) {
                enemyImgEl.src = customEnemyImageBase64;
                enemyImgEl.classList.remove('hidden');
                enemyIcon.classList.add('hidden');
                enemyNameTag.textContent = "極惡頭目";
            } else {
                enemyImgEl.classList.add('hidden');
                enemyIcon.classList.remove('hidden');
                const enemy = enemies[currentWordIndex % enemies.length];
                enemyIcon.className = `fa-solid ${enemy.icon} text-5xl ${enemy.color} drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]`;
                enemyNameTag.textContent = enemy.name;
            }
        }

        function triggerSlashAnimation(callback) {
            const heroCard = document.getElementById('heroCard');
            const enemyCard = document.getElementById('enemyCard');

            heroCard.classList.add('slash-anim');
            setTimeout(() => enemyCard.classList.add('hit-anim'), 250);

            setTimeout(() => {
                heroCard.classList.remove('slash-anim');
                enemyCard.classList.remove('hit-anim');
                if (callback) callback();
            }, 700);
        }

        async function evaluateDictation() {
            if (strokeHistory.length === 0) {
                window.showToast("⚠️ 請先寫字再交卷！");
                return;
            }

            const currentChar = wordBank[currentWordIndex];
            const userStrokes = strokeHistory.length;
            let expectedStrokes = -1;
            
            try {
                const charData = await HanziWriter.loadCharacterData(currentChar);
                expectedStrokes = charData.strokes.length;
            } catch(e) {
                console.warn("Could not load char data for stroke verification");
            }

            let isPass = false;
            let failReason = "";

            let minX = 999, maxX = 0, minY = 999, maxY = 0;
            let totalDistance = 0;

            strokeHistory.forEach(stroke => {
                for (let i = 0; i < stroke.length; i++) {
                    let pt = stroke[i];
                    minX = Math.min(minX, pt.x);
                    maxX = Math.max(maxX, pt.x);
                    minY = Math.min(minY, pt.y);
                    maxY = Math.max(maxY, pt.y);
                    if (i > 0) {
                        totalDistance += Math.hypot(pt.x - stroke[i-1].x, pt.y - stroke[i-1].y);
                    }
                }
            });

            const spanX = maxX - minX;
            const spanY = maxY - minY;

            if (currentLearningMode === 'COPYBOOK') {
                // Copybook mode: Encouraging validation for practice
                if (totalDistance < 30 || spanX < 20 || spanY < 20) {
                    isPass = false;
                    failReason = "筆劃太少或未開始書寫";
                } else {
                    isPass = true;
                }
            } else {
                // QUIZ Mode: Primary School Teacher Standard Evaluation
                if (expectedStrokes > 0) {
                    const diff = Math.abs(userStrokes - expectedStrokes);
                    // Tolerances based on character complexity
                    const allowedDiff = expectedStrokes <= 3 ? 0 : (expectedStrokes <= 8 ? 1 : 2);

                    if (diff > allowedDiff) {
                        isPass = false;
                        failReason = `筆劃數不符 (應為${expectedStrokes}劃，你寫了${userStrokes}劃)`;
                    } else if (totalDistance < expectedStrokes * 18 || spanX < 35 || spanY < 35) {
                        isPass = false;
                        failReason = "筆跡過小或結構不完整";
                    } else {
                        isPass = true;
                    }
                } else {
                    isPass = userStrokes >= 1 && totalDistance > 50;
                }
            }

            // High contrast snapshot for review modal
            const offscreenCanvas = document.createElement('canvas');
            const dpr = window.devicePixelRatio || 1;
            offscreenCanvas.width = 250 * dpr;
            offscreenCanvas.height = 250 * dpr;
            const ctx = offscreenCanvas.getContext('2d');
            ctx.scale(dpr, dpr);
            
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, 250, 250);

            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 10;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            strokeHistory.forEach(stroke => {
                if (stroke.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(stroke[0].x, stroke[0].y);
                    for (let i = 1; i < stroke.length; i++) {
                        ctx.lineTo(stroke[i].x, stroke[i].y);
                    }
                    ctx.stroke();
                }
            });

            const dataUrl = offscreenCanvas.toDataURL("image/png");

            dictationResults.push({
                char: currentChar,
                userCanvasDataUrl: dataUrl,
                pass: isPass,
                expected: expectedStrokes,
                actual: userStrokes,
                reason: failReason
            });

            if (isPass) {
                score += 500;
                combo++;
                maxCombo = Math.max(maxCombo, combo);
            } else {
                combo = 0;
            }

            triggerSlashAnimation(() => {
                currentWordIndex++;
                if (currentWordIndex >= wordBank.length) {
                    showDictationReviewModal();
                } else {
                    loadCurrentCharacter();
                }
            });
        }

        function showDictationReviewModal() {
            document.getElementById('pauseGameBtn').classList.add('hidden');
            const reviewGrid = document.getElementById('reviewGrid');
            reviewGrid.innerHTML = '';

            const wrongCount = dictationResults.filter(r => !r.pass).length;
            document.getElementById('wrongWordCount').textContent = wrongCount;

            dictationResults.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/95 border border-slate-700 rounded-3xl p-5 flex flex-col items-center shadow-2xl w-[280px] backdrop-blur-md";
                
                const statusBadge = item.pass 
                    ? `<span class="px-3 py-2 rounded-lg bg-emerald-900 text-emerald-300 text-sm font-bold border border-emerald-500 shadow-lg w-full text-center tracking-wider flex flex-col justify-center h-[56px]">✔ 寫對 (PASS)</span>`
                    : `<span class="px-2 py-1.5 rounded-lg bg-red-950 text-red-300 text-[11px] font-bold border border-red-500 shadow-lg w-full text-center tracking-wider flex flex-col justify-center h-[56px] leading-tight"><span class="text-xs mb-0.5 font-bold">✖ 寫錯 (FAIL)</span><span class="text-red-400 font-normal text-[10px] truncate">${item.reason || '結構不符'}</span></span>`;

                card.innerHTML = `
                    <div class="flex justify-between items-center w-full mb-3 px-1">
                        <span class="text-amber-400 font-bold text-base">目標字: <strong class="text-2xl text-amber-200 font-calligraphy ml-1">${item.char}</strong></span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 w-full mb-4">
                        <div class="flex flex-col items-center">
                            <span class="text-[11px] text-amber-500 font-bold mb-1 whitespace-nowrap">標準正字 (${item.expected > 0 ? item.expected : '-'}劃)</span>
                            <div class="w-[100px] h-[100px] bg-slate-800 rounded-xl border-2 border-amber-500 flex items-center justify-center shadow-inner">
                                <span class="text-6xl text-amber-300 font-calligraphy">${item.char}</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[11px] text-cyan-400 font-bold mb-1 whitespace-nowrap">你的手寫 (${item.actual}劃)</span>
                            <div class="w-[100px] h-[100px] bg-slate-950 rounded-xl border-2 border-cyan-500 overflow-hidden shadow-inner flex items-center justify-center">
                                <img src="${item.userCanvasDataUrl}" class="w-full h-full object-cover">
                            </div>
                        </div>
                    </div>
                    <div class="w-full flex space-x-2">
                        ${statusBadge}
                        <button onclick="speakCantonese('${item.char}')" class="px-3.5 py-2 rounded-lg bg-amber-900 hover:bg-amber-800 text-amber-200 text-sm font-bold border border-amber-600 transition shadow-lg shrink-0">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                `;
                reviewGrid.appendChild(card);
            });

            document.getElementById('dictationReviewModal').classList.remove('hidden');
        }

        function endGame(isWin) {
            document.getElementById('pauseGameBtn').classList.add('hidden');
            document.getElementById('gameOverTitle').textContent = isWin ? "水 鄉 大 捷" : "城 關 告 急";
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalCombo').textContent = maxCombo;
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        function startWordBankSession(bank) {
            wordBank = [...bank];
            if (isRandomOrder) wordBank.sort(() => Math.random() - 0.5);
            dictationResults = [];
            currentWordIndex = 0;
            score = 0;
            combo = 0;
            hp = 100;
            
            document.getElementById('pauseGameBtn').classList.remove('hidden');
            loadCurrentCharacter();
        }

        function loadCurrentCharacter() {
            const char = wordBank[currentWordIndex];
            document.getElementById('wordIndexTag').textContent = `目標 ${currentWordIndex + 1} / ${wordBank.length}`;
            initHanziWriter(char);
        }

        // Image optimization helper (canvas resize & compress)
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 300;
                    let w = img.width, h = img.height;
                    if (w > h) {
                        if (w > maxDim) { h *= maxDim / w; w = maxDim; }
                    } else {
                        if (h > maxDim) { w *= maxDim / h; h = maxDim; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const dismissKeyboard = () => {
                if (document.activeElement && document.activeElement.blur) {
                    document.activeElement.blur();
                }
            };

            const guidedBtn = document.getElementById('startModeGuidedBtn');
            const copybookBtn = document.getElementById('startModeCopybookBtn');
            const quizBtn = document.getElementById('startModeQuizBtn');

            function updateModeUI() {
                guidedBtn.className = currentLearningMode === 'GUIDED' ? "px-2 py-1.5 rounded text-[11px] font-bold bg-amber-500 text-black shadow text-center" : "px-2 py-1.5 rounded text-[11px] font-bold bg-slate-700 text-gray-300 border border-slate-600 hover:text-amber-200 text-center";
                copybookBtn.className = currentLearningMode === 'COPYBOOK' ? "px-2 py-1.5 rounded text-[11px] font-bold bg-amber-500 text-black shadow text-center" : "px-2 py-1.5 rounded text-[11px] font-bold bg-slate-700 text-gray-300 border border-slate-600 hover:text-amber-200 text-center";
                quizBtn.className = currentLearningMode === 'QUIZ' ? "px-2 py-1.5 rounded text-[11px] font-bold bg-amber-500 text-black shadow text-center" : "px-2 py-1.5 rounded text-[11px] font-bold bg-slate-700 text-gray-300 border border-slate-600 hover:text-amber-200 text-center";
            }

            guidedBtn.onclick = () => { currentLearningMode = 'GUIDED'; updateModeUI(); };
            copybookBtn.onclick = () => { currentLearningMode = 'COPYBOOK'; updateModeUI(); };
            quizBtn.onclick = () => { currentLearningMode = 'QUIZ'; updateModeUI(); };

            const seqBtn = document.getElementById('orderSequentialBtn');
            const randBtn = document.getElementById('orderRandomBtn');
            seqBtn.onclick = () => {
                isRandomOrder = false;
                seqBtn.className = "px-2.5 py-1 rounded text-xs font-bold bg-amber-500 text-black shadow";
                randBtn.className = "px-2.5 py-1 rounded text-xs font-bold bg-slate-700 text-gray-300 border border-slate-600 hover:text-amber-200";
            };
            randBtn.onclick = () => {
                isRandomOrder = true;
                randBtn.className = "px-2.5 py-1 rounded text-xs font-bold bg-amber-500 text-black shadow";
                seqBtn.className = "px-2.5 py-1 rounded text-xs font-bold bg-slate-700 text-gray-300 border border-slate-600 hover:text-amber-200";
            };

            const gradeBtns = document.querySelectorAll('.grade-btn');
            gradeBtns.forEach(btn => {
                btn.onclick = (e) => {
                    dismissKeyboard();
                    const activeGradeKey = e.currentTarget.getAttribute('data-grade');
                    const vocab = gradeVocabularies[activeGradeKey];
                    if (vocab) {
                        const sampleWords = getRandomWordsFromPool(vocab.pool, 15);
                        document.getElementById('parentCustomInput').value = sampleWords.join(' ');
                        gradeBtns.forEach(b => b.className = "grade-btn px-1 py-1 rounded bg-slate-700 text-gray-300 text-[11px] font-bold border border-slate-600 hover:border-amber-400 hover:text-amber-300 transition text-center leading-tight");
                        e.currentTarget.className = "grade-btn px-1 py-1 rounded bg-amber-500 text-black text-[11px] font-bold transition text-center leading-tight";
                    }
                };
            });

            document.getElementById('presetBtn').onclick = () => {
                dismissKeyboard();
                document.getElementById('parentCustomInput').value = "學 習 努 力 香 港";
            };

            ['heroPhotoInput', 'modalHeroPhotoInput'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            compressImage(file, (dataUrl) => {
                                customHeroImageBase64 = dataUrl;
                                document.getElementById('heroImgEl').src = customHeroImageBase64;
                                document.getElementById('resetHeroPhotoBtn').classList.remove('hidden');
                            });
                        }
                    });
                }
            });

            ['enemyPhotoInput', 'modalEnemyPhotoInput'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            compressImage(file, (dataUrl) => {
                                customEnemyImageBase64 = dataUrl;
                                updateEnemyUI();
                                document.getElementById('resetEnemyPhotoBtn').classList.remove('hidden');
                            });
                        }
                    });
                }
            });

            document.getElementById('animateBtn').onclick = () => writer?.animateCharacter();
            document.getElementById('eraserBtn').onclick = () => clearDictationCanvas();
            document.getElementById('submitQuizBtn').onclick = () => evaluateDictation();
            document.getElementById('speakBtn').onclick = () => {
                warmUpSpeech();
                speakCantonese(wordBank[currentWordIndex]);
            };

            document.getElementById('startGameBtn').onclick = () => {
                warmUpSpeech();
                dismissKeyboard();
                const val = document.getElementById('parentCustomInput').value.trim();
                if (val) {
                    originalWordBank = val.replace(/[^\u4e00-\u9fa5]/g, '').split('');
                } else {
                    originalWordBank = gradeVocabularies['P1'].pool.slice(0, 5);
                }
                
                if (originalWordBank.length > 0) {
                    document.getElementById('startModal').classList.add('hidden');
                    startWordBankSession(originalWordBank);
                } else {
                    window.showToast("請輸入有效中文字！");
                }
            };

            document.getElementById('reviewRetryAllBtn').onclick = () => {
                document.getElementById('dictationReviewModal').classList.add('hidden');
                startWordBankSession(originalWordBank);
            };
            document.getElementById('reviewRetryErrorsBtn').onclick = () => {
                const wrongs = dictationResults.filter(r => !r.pass).map(r => r.char);
                if (wrongs.length === 0) return window.showToast("全部正確！");
                document.getElementById('dictationReviewModal').classList.add('hidden');
                startWordBankSession(wrongs);
            };
            document.getElementById('reviewHomeBtn').onclick = () => {
                document.getElementById('dictationReviewModal').classList.add('hidden');
                document.getElementById('startModal').classList.remove('hidden');
            };
            
            document.getElementById('playAgainBtn').onclick = () => {
                document.getElementById('gameOverModal').classList.add('hidden');
                document.getElementById('startModal').classList.remove('hidden');
            };

            document.getElementById('pauseGameBtn').onclick = () => {
                document.getElementById('pauseModal').classList.remove('hidden');
                if (currentLearningMode !== 'GUIDED') document.getElementById('pauseSurrenderBtn').classList.remove('hidden');
            };
            document.getElementById('pauseResumeBtn').onclick = () => document.getElementById('pauseModal').classList.add('hidden');
            document.getElementById('pauseHomeBtn').onclick = () => {
                document.getElementById('pauseModal').classList.add('hidden');
                document.getElementById('pauseGameBtn').classList.add('hidden');
                document.getElementById('startModal').classList.remove('hidden');
            };
            document.getElementById('pauseSurrenderBtn').onclick = () => {
                document.getElementById('pauseModal').classList.add('hidden');
                showDictationReviewModal();
            };

            document.getElementById('openSaveModalBtn').onclick = () => document.getElementById('saveModal').classList.remove('hidden');
            document.getElementById('closeSaveModalBtn').onclick = () => document.getElementById('saveModal').classList.add('hidden');
            document.getElementById('openLoadModalBtn').onclick = () => {
                if (window.renderSaveSlotsList) window.renderSaveSlotsList();
                document.getElementById('loadModal').classList.remove('hidden');
            };
            document.getElementById('closeLoadModalBtn').onclick = () => document.getElementById('loadModal').classList.add('hidden');
        });
    </script>
