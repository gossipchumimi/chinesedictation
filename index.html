<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <!-- 完美支援 iPad 及手機，禁止縮放與彈性滑動 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>漢字筆順守衛戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ink-slash-game';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        let auth, db, currentUser = null;

        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            async function initAuth() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        const userCred = await signInWithCustomToken(auth, __initial_auth_token);
                        currentUser = userCred.user;
                    } else {
                        const userCred = await signInAnonymously(auth);
                        currentUser = userCred.user;
                    }
                    if (window.loadCloudData) window.loadCloudData();
                } catch (e) {
                    console.error("Firebase auth error:", e);
                }
            }
            initAuth();
        }

        window.saveCloudDataToSlot = async function(slotNumber, customTitle) {
            const currentWords = document.getElementById('parentCustomInput')?.value.trim() || "";
            const slotName = customTitle || `存檔槽 ${slotNumber}`;

            if (!currentWords) {
                if (window.showToast) window.showToast("⚠️ 請先在框內輸入要儲存的字詞！");
                return;
            }

            let localSlots = JSON.parse(localStorage.getItem('ink_slash_save_slots') || '{}');
            localSlots[slotNumber] = { title: slotName, words: currentWords, date: new Date().toLocaleDateString() };
            localStorage.setItem('ink_slash_save_slots', JSON.stringify(localSlots));
            localStorage.setItem('ink_slash_last_words', currentWords);

            if (window.renderSaveSlotsList) window.renderSaveSlotsList();
            if (window.showToast) window.showToast(`💾 已成功儲存至「${slotName}」！`);

            if (db && currentUser) {
                try {
                    const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'saveData', 'slots');
                    await setDoc(userDocRef, { slots: localSlots, updatedAt: Date.now() }, { merge: true });
                } catch (err) {
                    console.error("Cloud Slot Save error:", err);
                }
            }
        };

        window.loadCloudData = async function() {
            const lastWords = localStorage.getItem('ink_slash_last_words');
            if (lastWords && document.getElementById('parentCustomInput')) {
                document.getElementById('parentCustomInput').value = lastWords;
            }
            if (window.renderSaveSlotsList) window.renderSaveSlotsList();

            if (!db || !currentUser) return;
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'saveData', 'slots');
                const docSnap = await getDoc(userDocRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.slots) {
                        localStorage.setItem('ink_slash_save_slots', JSON.stringify(data.slots));
                        if (window.renderSaveSlotsList) window.renderSaveSlotsList();
                    }
                }
            } catch (err) {
                console.error("Cloud Load error:", err);
            }
        };
    </script>

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }
        body, html {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #080c14;
            color: #f1f5f9;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        .font-calligraphy { 
            font-family: 'Noto Serif TC', serif; 
            font-weight: 900;
        }
        .glow-gold { text-shadow: 0 0 14px rgba(245, 158, 11, 0.95), 0 0 35px rgba(217, 119, 6, 0.85); }

        .ink-card {
            border: 2px solid rgba(245, 158, 11, 0.5);
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.95);
        }

        @keyframes slashAttack {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            30% { transform: scale(1.18) translate(40px, -15px) rotate(8deg); filter: brightness(1.6) drop-shadow(0 0 25px #f59e0b); }
            60% { transform: scale(1.08) translate(15px, 0px) rotate(-3deg); filter: brightness(1.3); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        }

        @keyframes hitEnemy {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            20% { transform: scale(0.9) translate(-30px, 10px) rotate(-15deg); filter: brightness(3) sepia(1) hue-rotate(-50deg); }
            50% { transform: scale(1.15) translate(40px, -40px) rotate(25deg); opacity: 0.8; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
        }

        .slash-anim { animation: slashAttack 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .hit-anim { animation: hitEnemy 0.65s cubic-bezier(0.25, 1, 0.5, 1); }

        .character-frame {
            position: relative;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 3px solid #f59e0b;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(245, 158, 11, 0.2);
            border-radius: 20px;
            overflow: hidden;
        }

        /* 確保畫布在 iPad 不會因為觸控而滾動頁面 */
        #dictationCanvas, #hanziWriterTarget {
            touch-action: none;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.8); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #fbbf24; }
    </style>
</head>
<body class="relative flex items-center justify-center">

    <div id="toastMessage" class="fixed top-5 left-1/2 -translate-x-1/2 z-[60] bg-slate-900 border-2 border-amber-400 text-amber-200 px-5 py-2.5 rounded-2xl shadow-2xl font-bold font-calligraphy opacity-0 transition-opacity pointer-events-none text-base"></div>
    
    <!-- 遊戲背景 -->
    <div id="bgContainer" class="absolute inset-0 z-0 bg-no-repeat" style="background-image: url('https://live.staticflickr.com/65535/55590661099_522b14d801_z.jpg'); background-size: cover; background-position: center; filter: brightness(0.65) contrast(1.1);"></div>

    <!-- 暫停按鈕 -->
    <button id="pauseGameBtn" class="hidden absolute top-4 right-4 z-30 bg-slate-900/95 hover:bg-slate-800 border-2 border-amber-500/80 text-amber-300 w-12 h-12 rounded-2xl shadow-2xl flex items-center justify-center text-xl transition active:scale-95 pointer-events-auto cursor-pointer">
        <i class="fa-solid fa-pause"></i>
    </button>

    <!-- 遊戲畫面：加入 flex-col md:flex-row 適應 iPad 橫直排版 -->
    <div id="gameScene" class="absolute inset-0 z-10 flex flex-col md:flex-row items-center justify-between md:justify-around px-4 md:px-10 py-10 md:py-16 pointer-events-none max-w-[1400px] mx-auto w-full h-full overflow-y-auto md:overflow-hidden gap-6 md:gap-0">
        
        <!-- 主角面板 -->
        <div id="heroCard" class="w-full sm:w-[35%] md:w-[28%] max-w-[240px] h-auto md:h-[75%] min-h-[260px] flex flex-col items-center justify-between p-3 character-frame transition-all duration-300 pointer-events-auto shrink-0 mt-8 md:mt-0">
            <label for="heroPhotoInput" class="cursor-pointer bg-amber-950/90 hover:bg-amber-800 text-amber-300 border border-amber-500/60 px-2.5 py-1 rounded-xl text-sm font-bold shadow-lg transition flex items-center space-x-1 z-10">
                <i class="fa-solid fa-camera"></i>
                <span id="uploadPhotoLabel">主角相片</span>
            </label>
            <input type="file" id="heroPhotoInput" accept="image/*" class="hidden">

            <div id="heroImgWrapper" class="relative w-full flex-1 min-h-[50%] flex items-center justify-center overflow-hidden my-2 rounded-xl border-2 border-amber-400/80 bg-slate-900/60 shadow-inner">
                <img id="heroImgEl" src="https://live.staticflickr.com/65535/55590224936_9b150393c9_z.jpg" alt="鎮守大將" class="w-full h-full object-cover rounded-lg transition-all">
            </div>

            <div class="w-full flex flex-col items-center">
                <div class="bg-gradient-to-r from-red-950 via-amber-900 to-red-950 border border-amber-400 px-3 py-1.5 rounded-full text-center shadow-lg w-full truncate">
                    <span id="heroNameTag" class="text-amber-200 font-calligraphy font-black text-lg tracking-wider">關雲長</span>
                </div>
                <button id="resetHeroPhotoBtn" class="hidden text-xs text-gray-400 hover:text-amber-300 mt-1 underline">重置角色</button>
            </div>
        </div>

        <!-- 寫字區域 -->
        <div id="writingAreaContainer" class="pointer-events-auto flex flex-col items-center z-25 flex-1 mx-0 md:mx-4 w-full">
            <div id="charHeaderInfo" class="mb-3 bg-slate-900 border-2 border-amber-500 px-6 py-3 rounded-2xl flex items-center space-x-4 shadow-2xl w-[292px] justify-center">
                <div class="relative w-16 h-16 bg-slate-800 rounded-xl border-2 border-red-500/80 flex items-center justify-center overflow-hidden shrink-0">
                    <span id="targetCharTitle" class="text-4xl font-calligraphy text-amber-300 glow-gold z-10">學</span>
                </div>
                <div class="h-12 w-px bg-slate-700 shrink-0"></div>
                <div class="flex flex-col justify-center gap-1.5">
                    <span id="wordIndexTag" class="text-xs bg-red-950 text-red-300 px-2.5 py-0.5 rounded border border-red-500/50 font-bold font-calligraphy text-center">目標 1 / 6</span>
                    <div class="flex items-center space-x-1.5 bg-amber-950 border border-amber-500/70 px-2 py-0.5 rounded-lg shadow-inner">
                        <span id="jyutpingText" class="text-sm text-amber-200 font-bold font-mono">hok6</span>
                        <button id="speakBtn" class="text-amber-300 hover:text-amber-100 active:scale-90 transition p-1 text-sm">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="canvasFrame" class="relative rounded-3xl p-4 bg-slate-900 border-4 border-amber-500 shadow-2xl flex flex-col items-center">
                <div id="canvasContainer" class="relative flex items-center justify-center" style="width: 260px; height: 260px;">
                    <div id="gridOverlay" class="absolute inset-0 rounded-xl border-2 border-red-500/50 pointer-events-none grid grid-cols-3 grid-rows-3 z-10">
                        <div class="border-r border-b border-red-500/30"></div>
                        <div class="border-r border-b border-red-500/30"></div>
                        <div class="border-b border-red-500/30"></div>
                        <div class="border-r border-b border-red-500/30"></div>
                        <div class="border-r border-b border-red-500/30"></div>
                        <div class="border-b border-red-500/30"></div>
                        <div class="border-r border-red-500/30"></div>
                        <div class="border-r border-red-500/30"></div>
                        <div></div>
                    </div>
                    <div id="hanziWriterTarget" class="absolute inset-0 bg-transparent rounded-xl overflow-hidden cursor-crosshair z-0" style="width: 260px; height: 260px;"></div>
                    <!-- 必須完美覆蓋並支援觸控防滑動 -->
                    <canvas id="dictationCanvas" class="absolute inset-0 rounded-xl z-20 cursor-crosshair hidden" width="260" height="260" style="width: 260px; height: 260px; touch-action: none;"></canvas>
                </div>

                <div class="w-full flex items-center justify-center gap-2 mt-4 z-30">
                    <button id="animateBtn" class="bg-emerald-800 hover:bg-emerald-700 text-emerald-200 px-4 py-2.5 rounded-xl border border-emerald-500 text-sm font-bold shadow-lg flex items-center space-x-1 transition">
                        <i class="fa-solid fa-play"></i>
                        <span>動畫示範</span>
                    </button>
                    <button id="eraserBtn" class="hidden bg-slate-700 hover:bg-slate-600 text-amber-300 px-4 py-2.5 rounded-xl border border-amber-500 text-sm font-bold shadow-lg flex items-center space-x-1 transition">
                        <i class="fa-solid fa-eraser"></i>
                        <span>清除重寫</span>
                    </button>
                    <button id="submitQuizBtn" class="hidden bg-amber-500 hover:bg-amber-400 text-black px-5 py-2.5 rounded-xl border border-amber-300 text-sm font-black shadow-lg font-calligraphy flex items-center space-x-1 transition">
                        <span>揮刀 (下一字) ➡️</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 對手面板 -->
        <div id="enemyCard" class="w-full sm:w-[35%] md:w-[28%] max-w-[240px] h-auto md:h-[75%] min-h-[260px] flex flex-col items-center justify-between p-3 character-frame transition-all duration-300 pointer-events-auto shrink-0 mb-8 md:mb-0">
            <label for="enemyPhotoInput" class="cursor-pointer bg-red-950/90 hover:bg-red-900 text-red-300 border border-red-500/60 px-2.5 py-1 rounded-xl text-sm font-bold shadow-lg transition flex items-center space-x-1 z-10">
                <i class="fa-solid fa-camera"></i>
                <span id="uploadEnemyPhotoLabel">對手相片</span>
            </label>
            <input type="file" id="enemyPhotoInput" accept="image/*" class="hidden">

            <div id="enemyImgWrapper" class="relative w-full flex-1 min-h-[45%] flex items-center justify-center overflow-hidden my-2 rounded-xl border-2 border-red-500/80 bg-slate-900/80 shadow-inner">
                <img id="enemyImgEl" src="" alt="擊退對象" class="w-full h-full object-cover rounded-lg transition-all hidden">
                <i id="enemyIcon" class="fa-solid fa-skull-crossbones text-6xl text-amber-400 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]"></i>
            </div>

            <div class="w-full text-center flex flex-col items-center">
                <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-red-800 mb-1.5">
                    <div id="enemyHpBar" class="h-full bg-red-600 w-full transition-all duration-300"></div>
                </div>
                <div class="bg-amber-950/90 border border-amber-500 px-3 py-1.5 rounded-full text-center shadow-lg w-full truncate">
                    <span id="enemyNameTag" class="text-red-300 font-calligraphy font-bold text-sm">水鄉水賊</span>
                </div>
                <button id="resetEnemyPhotoBtn" class="hidden text-xs text-gray-400 hover:text-red-300 mt-1 underline">重置對手</button>
            </div>
        </div>
    </div>

    <!-- Start Modal: 背景固定向左對齊保證見到「默攻」，面版推向右邊 -->
    <div id="startModal" class="absolute inset-0 z-40 flex items-center justify-end pr-4 md:pr-12 lg:pr-24 py-4 overflow-y-auto bg-no-repeat" style="background-image: url('https://live.staticflickr.com/65535/55590440216_d02384f618_z.jpg'); background-size: cover; background-position: left center;">
        
        <div class="bg-[#111827]/95 p-6 rounded-2xl max-w-[500px] w-full text-left relative shadow-[0_0_50px_rgba(0,0,0,0.9)] border border-amber-500/30 max-h-[96vh] overflow-y-auto">
            
            <h2 class="text-xl text-amber-400 mb-5 font-bold text-center font-calligraphy tracking-wider">請選擇學習模式與設定默寫詞庫</h2>

            <div class="space-y-4">
                <div class="bg-[#1f2937]/90 p-4 rounded-xl border border-slate-700">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-sm font-bold text-amber-300 flex items-center">
                            <span class="mr-2">👨‍👩‍👧‍👦</span> 學生自訂默寫/考核字詞:
                        </label>
                        <button id="presetBtn" type="button" class="text-xs text-cyan-200 bg-cyan-900 px-3 py-1.5 rounded border border-cyan-700 hover:bg-cyan-800 font-bold transition">預設範例</button>
                    </div>

                    <div class="mb-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-amber-400 font-bold">🎓 香港小學年級海量詞庫 (自動隨機抽題):</span>
                            <span class="text-[10px] text-gray-400">💡 隨機抽取約20字</span>
                        </div>
                        <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="gradeSelectorGrid">
                            <button type="button" data-grade="P1" class="grade-btn px-2 py-1.5 rounded bg-slate-700 text-gray-300 text-[11px] font-bold border border-slate-600 hover:border-amber-400 hover:text-amber-300 transition text-center leading-tight">小一<br>(P1)</button>
                            <button type="button" data-grade="P2" class="grade-btn px-2 py-1.5 rounded bg-slate-700 text-gray-300 text-[11px] font-bold border border-slate-600 hover:border-amber-400 hover:text-amber-300 transition text-center leading-tight">小二<br>(P2)</button>
                            <button type="button" data-grade="P3" class="grade-btn px-2 py-1.5 rounded bg-slate-700 text-gray-300 text-[11px] font-bold border border-slate-600 hover:border-amber-400 hover:text-amber-300 transition text-center leading-tight">小三<br>(P3)</button>
                            <button type="button" data-grade="P4" class="grade-btn px-2 py-1.5 rounded bg-slate-700 text-gray-300 text-[11px] font-bold border border-slate-600 hover:border-amber-400 hover:text-amber-300 transition text-center leading-tight">小四<br>(P4)</button>
                            <button type="button" data-grade="P5" class="grade-btn px-2 py-1.5 rounded bg-slate-700 text-gray-300 text-[11px] font-bold border border-slate-600 hover:border-amber-400 hover:text-amber-300 transition text-center leading-tight">小五<br>(P5)</button>
                            <button type="button" data-grade="P6" class="grade-btn px-2 py-1.5 rounded bg-slate-700 text-gray-300 text-[11px] font-bold border border-slate-600 hover:border-amber-400 hover:text-amber-300 transition text-center leading-tight">小六<br>(P6)</button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-[#1f2937]/90 p-3 rounded-xl border border-slate-700 flex items-center justify-between">
                        <span class="text-xs text-amber-400 font-bold shrink-0 mr-2">將軍名號:</span>
                        <input type="text" id="playerNameInput" class="w-full bg-slate-900 border border-slate-700 rounded-md px-2 py-1 text-sm text-amber-200 font-bold" value="關雲長">
                    </div>
                    <div class="bg-[#1f2937]/90 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                        <span class="text-xs text-amber-400 font-bold">主角造型:</span>
                        <label for="modalHeroPhotoInput" class="cursor-pointer text-xs text-amber-300 bg-amber-900/60 hover:bg-amber-800 px-3 py-1.5 rounded border border-amber-500/50 font-bold">選擇相片</label>
                        <input type="file" id="modalHeroPhotoInput" accept="image/*" class="hidden">
                    </div>
                </div>

                <div class="bg-[#1f2937]/90 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                    <span class="text-sm text-amber-400 font-bold">敵人造型:</span>
                    <label for="modalEnemyPhotoInput" class="cursor-pointer text-xs text-red-300 bg-red-900/60 hover:bg-red-800 px-3 py-1.5 rounded border border-red-500/50 font-bold">選擇相片</label>
                    <input type="file" id="modalEnemyPhotoInput" accept="image/*" class="hidden">
                </div>

                <div class="bg-[#1f2937]/90 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                    <span class="text-sm text-amber-400 font-bold">學習模式:</span>
                    <div class="flex space-x-2">
                        <button type="button" id="startModeGuidedBtn" class="px-3 py-1.5 rounded text-xs font-bold bg-amber-500 text-black shadow">描紅練習</button>
                        <button type="button" id="startModeQuizBtn" class="px-3 py-1.5 rounded text-xs font-bold bg-slate-700 text-gray-300 border border-slate-600 hover:text-amber-200">默寫考核 (一筆過)</button>
                    </div>
                </div>

                <div class="bg-[#1f2937]/90 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                    <span class="text-sm text-amber-400 font-bold">出題次序:</span>
                    <div class="flex space-x-2">
                        <button type="button" id="orderSequentialBtn" class="px-3 py-1.5 rounded text-xs font-bold bg-amber-500 text-black shadow">順序出題</button>
                        <button type="button" id="orderRandomBtn" class="px-3 py-1.5 rounded text-xs font-bold bg-slate-700 text-gray-300 border border-slate-600 hover:text-amber-200">隨機洗牌</button>
                    </div>
                </div>

                <div class="bg-[#1f2937]/90 p-4 rounded-xl border border-slate-700">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm text-amber-400 font-bold">✏️ 輸入字詞 (用空格分隔):</span>
                        <div class="flex space-x-2">
                            <button id="openSaveModalBtn" type="button" class="text-xs text-emerald-200 bg-emerald-900 hover:bg-emerald-800 px-2.5 py-1.5 rounded border border-emerald-700 font-bold transition">💾 儲存 Save</button>
                            <button id="openLoadModalBtn" type="button" class="text-xs text-amber-200 bg-amber-900 hover:bg-amber-800 px-2.5 py-1.5 rounded border border-amber-700 font-bold transition">📂 載入 Load</button>
                        </div>
                    </div>
                    <textarea id="parentCustomInput" rows="2" class="w-full bg-[#111827] border border-slate-600 rounded-lg p-3 text-sm text-amber-100 focus:outline-none focus:border-amber-500 font-bold resize-none" placeholder="請輸入詞庫，例如: 學習 努力 香港"></textarea>
                </div>

                <button id="startGameBtn" type="button" class="w-full py-4 rounded-xl bg-gradient-to-r from-red-700 via-red-600 to-red-700 text-black font-black text-lg hover:brightness-110 active:scale-95 transition shadow-lg font-calligraphy text-center border-t border-red-400">
                    ⚔️ 率領武將 鎮守水鄉 (開始遊戲)

    <script>
        // --- 狀態變數 ---
        let gameState = 'START';

        let writer = null;

        let combo = 0;
        let maxCombo = 0;
        let isGuidedMode = true;
        let isRandomOrder = false;

        let isDrawing = false;
        let dictationCtx = null;
        let strokeHistory = [];
        let dictationResults = [];
        let currentWordIndex = 0;
        let originalWordBank = [];
        let wordBank = [];

        let customHeroImageBase64 = null;
        let customEnemyImageBase64 = null;

        // --- 詞庫 ---

        const enemies = [
            { name: "水鄉水賊", icon: "fa-user-ninja", color: "text-amber-400" },

            { name: "黑風寨主", icon: "fa-mask", color: "text-cyan-400" }
        ];

        window.showToast = function(msg) {
            const toast = document.getElementById('toastMessage');
            if (toast) {
                toast.textContent = msg;
                toast.classList.remove('opacity-0');
                setTimeout(() => toast.classList.add('opacity-0'), 2500);
            }
        };

        function getRandomWordsFromPool(poolArray, count) {
            const shuffled = [...poolArray].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        // --- 畫布邏輯 (支援 iPad 觸控及防捲動) ---
        function initDictationCanvas() {
            const canvas = document.getElementById('dictationCanvas');
            if (!canvas) return;

            canvas.width = 260;
            canvas.height = 260;
            dictationCtx = canvas.getContext('2d', { willReadFrequently: true });
            clearDictationCanvas();

            canvas.onpointerdown = startDictationStroke;
            canvas.onpointermove = drawDictationStroke;
            canvas.onpointerup = endDictationStroke;
            canvas.onpointercancel = endDictationStroke;
            canvas.onpointerout = endDictationStroke;
        }

        function clearDictationCanvas() {
            if (dictationCtx) {
                dictationCtx.clearRect(0, 0, 260, 260);
            }
            strokeHistory = [];
        }

        function startDictationStroke(e) {
            isDrawing = true;
            const canvas = document.getElementById('dictationCanvas');
            const rect = canvas.getBoundingClientRect();
            
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            dictationCtx.strokeStyle = "#38bdf8"; 
            dictationCtx.lineWidth = 14;
            dictationCtx.lineCap = "round";
            dictationCtx.lineJoin = "round";
            dictationCtx.beginPath();
            dictationCtx.moveTo(x, y);

            strokeHistory.push([{ x, y }]);
            if(e.cancelable) e.preventDefault(); 
        }

        function drawDictationStroke(e) {
            if (!isDrawing || !dictationCtx) return;
            const canvas = document.getElementById('dictationCanvas');
            const rect = canvas.getBoundingClientRect();
            
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            dictationCtx.lineTo(x, y);
            dictationCtx.stroke();

            const currentStroke = strokeHistory[strokeHistory.length - 1];
            currentStroke.push({ x, y });
            if(e.cancelable) e.preventDefault();
        }

        function endDictationStroke(e) {
            isDrawing = false;
        }

        function initHanziWriter(char) {
            const writerTarget = document.getElementById('hanziWriterTarget');
            const dictationCanvas = document.getElementById('dictationCanvas');
            
            if (!writerTarget) return;
            writerTarget.innerHTML = '';
            clearDictationCanvas();

            if (isGuidedMode) {
                dictationCanvas.classList.add('hidden');
                document.getElementById('eraserBtn').classList.add('hidden');
                document.getElementById('submitQuizBtn').classList.add('hidden');
                document.getElementById('animateBtn').classList.remove('hidden');

                document.getElementById('targetCharTitle').textContent = char;

                writer = HanziWriter.create('hanziWriterTarget', char, {
                    width: 260, height: 260, padding: 8,
                    showOutline: true, showCharacter: false,
                    strokeAnimationSpeed: 1.5,
                    strokeColor: '#f59e0b',
                    outlineColor: 'rgba(245, 158, 11, 0.25)',
                    drawingColor: '#38bdf8',
                    strokeTolerance: 0.2,
                    showHintAfterMisses: 1
                });

                writer.quiz({
                    onMistake: function() {
                        combo = 0;
                        hp = Math.max(0, hp - 8);
                        window.showToast("⚠️ 筆順錯誤，士氣下降！");
                        if (hp <= 0) endGame(false);
                    },
                    onCorrectStroke: function(strokeData) {
                        combo++;
                        maxCombo = Math.max(maxCombo, combo);
                        score += 50 * combo;
                    },
                    onComplete: function() {
                        triggerSlashAnimation(() => {
                            score += 200;
                            currentWordIndex++;
                            if (currentWordIndex >= wordBank.length) endGame(true);
                            else loadCurrentCharacter();
                        });
                    }
                });
            } else {
                dictationCanvas.classList.remove('hidden');
                document.getElementById('eraserBtn').classList.remove('hidden');
                document.getElementById('animateBtn').classList.add('hidden');
                
                const submitBtn = document.getElementById('submitQuizBtn');
                submitBtn.classList.remove('hidden');
                submitBtn.innerHTML = currentWordIndex === wordBank.length - 1 ? "<span>交卷完成 ✅</span>" : "<span>揮刀 (下一字) ➡️</span>";

                document.getElementById('targetCharTitle').textContent = "？";
                initDictationCanvas();

                writer = HanziWriter.create('hanziWriterTarget', char, {
                    width: 260, height: 260, padding: 8,
                    showOutline: false, showCharacter: false, drawingColor: 'rgba(0,0,0,0)'
                });
            }

            updateEnemyUI();
        }

        function updateEnemyUI() {
            const enemyImgEl = document.getElementById('enemyImgEl');
            const enemyIcon = document.getElementById('enemyIcon');
            const enemyNameTag = document.getElementById('enemyNameTag');

            if (customEnemyImageBase64) {
                enemyImgEl.src = customEnemyImageBase64;
                enemyImgEl.classList.remove('hidden');
                enemyIcon.classList.add('hidden');
                enemyNameTag.textContent = "極惡頭目";
            } else {
                enemyImgEl.classList.add('hidden');
                enemyIcon.classList.remove('hidden');
                const enemy = enemies[currentWordIndex % enemies.length];
                enemyIcon.className = `fa-solid ${enemy.icon} text-6xl ${enemy.color} drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]`;
                enemyNameTag.textContent = enemy.name;
            }
        }

        function triggerSlashAnimation(callback) {
            const heroCard = document.getElementById('heroCard');
            const enemyCard = document.getElementById('enemyCard');

            heroCard.classList.add('slash-anim');
            setTimeout(() => enemyCard.classList.add('hit-anim'), 250);

            setTimeout(() => {
                heroCard.classList.remove('slash-anim');
                enemyCard.classList.remove('hit-anim');
                if (callback) callback();
            }, 700);
        }

        // --- 嚴格校對邏輯 ---
        async function evaluateDictation() {
            if (strokeHistory.length === 0) {
                window.showToast("⚠️ 請先寫字！");
                return;
            }

            const currentChar = wordBank[currentWordIndex];
            const userStrokes = strokeHistory.length;
            let expectedStrokes = -1;
            
            try {
                // 向 HanziWriter 查詢真實標準筆劃數
                const charData = await HanziWriter.loadCharacterData(currentChar);
                expectedStrokes = charData.strokes.length;
            } catch(e) {
                console.warn("Could not load character data for strict check.");
            }

            let isPass = false;
            let failReason = "";
            
            // 絕對嚴格審查模式 (Strict Mode)
            if (expectedStrokes > 0) {
                if (userStrokes !== expectedStrokes) {
                    isPass = false;
                    failReason = `筆劃數錯 (標準:${expectedStrokes}劃 / 你寫:${userStrokes}劃)`;
                } else {
                    isPass = true; // 筆劃數啱咗，再進一步驗證結構
                    
                    let minX = 999, maxX = 0, minY = 999, maxY = 0;
                    let totalDistance = 0;
                    
                    strokeHistory.forEach(stroke => {
                        for (let i = 0; i < stroke.length; i++) {
                            let pt = stroke[i];
                            minX = Math.min(minX, pt.x);
                            maxX = Math.max(maxX, pt.x);
                            minY = Math.min(minY, pt.y);
                            maxY = Math.max(maxY, pt.y);
                            if (i > 0) {
                                totalDistance += Math.hypot(pt.x - stroke[i-1].x, pt.y - stroke[i-1].y);
                            }
                        }
                    });
                    
                    // 防作弊與亂畫：判定筆跡總長度是否合理
                    if (totalDistance < expectedStrokes * 12) {
                        isPass = false;
                        failReason = "筆跡過短或不成字形";
                    }
                }
            } else {
                // 退底方案 (如果 HanziWriter 無數據)
                isPass = userStrokes >= 2 || currentChar === '一' || currentChar === '乙';
                if (!isPass) failReason = "字形結構不完整";
            }

            // 將畫布內容完整導出，加入深色底色保證清晰
            const offscreenCanvas = document.createElement('canvas');
            offscreenCanvas.width = 260;
            offscreenCanvas.height = 260;
            const ctx = offscreenCanvas.getContext('2d');
            
            ctx.fillStyle = '#0f172a'; // 深藍色底色
            ctx.fillRect(0, 0, 260, 260);

            ctx.strokeStyle = '#38bdf8'; // 螢光藍色筆跡
            ctx.lineWidth = 14;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            strokeHistory.forEach(stroke => {
                if (stroke.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(stroke[0].x, stroke[0].y);
                    for (let i = 1; i < stroke.length; i++) {
                        ctx.lineTo(stroke[i].x, stroke[i].y);
                    }
                    ctx.stroke();
                }
            });

            const dataUrl = offscreenCanvas.toDataURL("image/png");

            dictationResults.push({
                char: currentChar,
                userCanvasDataUrl: dataUrl,
                pass: isPass,
                expected: expectedStrokes,
                actual: userStrokes,
                reason: failReason
            });

            if (isPass) {
                score += 500;
                combo++;
                maxCombo = Math.max(maxCombo, combo);
            } else {
                combo = 0;
            }

            triggerSlashAnimation(() => {
                currentWordIndex++;
                if (currentWordIndex >= wordBank.length) {
                    showDictationReviewModal();
                } else {
                    loadCurrentCharacter();
                }
            });
        }

        function showDictationReviewModal() {
            document.getElementById('pauseGameBtn').classList.add('hidden');
            const reviewGrid = document.getElementById('reviewGrid');
            reviewGrid.innerHTML = '';

            const wrongCount = dictationResults.filter(r => !r.pass).length;
            document.getElementById('wrongWordCount').textContent = wrongCount;

            dictationResults.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/95 border border-slate-700 rounded-3xl p-5 flex flex-col items-center shadow-2xl w-[290px] backdrop-blur-md";
                
                const statusBadge = item.pass 
                    ? `<span class="px-3 py-2 rounded-lg bg-emerald-900 text-emerald-300 text-sm font-bold border border-emerald-500 shadow-lg w-full text-center tracking-wider flex flex-col justify-center h-[52px]">✔ 寫對 (PASS)</span>`
                    : `<span class="px-3 py-1.5 rounded-lg bg-red-950 text-red-300 text-[12px] font-bold border border-red-500 shadow-lg w-full text-center tracking-wider flex flex-col justify-center h-[52px] leading-tight"><span class="text-sm mb-0.5">✖ 寫錯 (FAIL)</span><span class="text-red-400 font-normal">${item.reason || '字形結構不符'}</span></span>`;

                card.innerHTML = `
                    <div class="flex justify-between items-center w-full mb-4 px-1">
                        <span class="text-amber-400 font-bold text-lg">目標字: <strong class="text-2xl text-amber-200 font-calligraphy ml-1">${item.char}</strong></span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 w-full mb-5">
                        <div class="flex flex-col items-center">
                            <span class="text-[11px] text-amber-500 font-bold mb-1.5 whitespace-nowrap">標準字 (筆劃:${item.expected > 0 ? item.expected : '-'})</span>
                            <div class="w-[110px] h-[110px] bg-slate-800 rounded-xl border-2 border-amber-500 flex items-center justify-center shadow-inner">
                                <span class="text-7xl text-amber-300 font-calligraphy">${item.char}</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[11px] text-cyan-400 font-bold mb-1.5 whitespace-nowrap">你的手寫 (筆劃:${item.actual})</span>
                            <div class="w-[110px] h-[110px] bg-[#0f172a] rounded-xl border-2 border-cyan-500 overflow-hidden shadow-inner flex items-center justify-center">
                                <img src="${item.userCanvasDataUrl}" class="w-full h-full object-cover">
                            </div>
                        </div>
                    </div>
                    <div class="w-full flex space-x-2">
                        ${statusBadge}
                        <button onclick="speakCantonese('${item.char}')" class="px-4 py-2 rounded-lg bg-amber-900 hover:bg-amber-800 text-amber-200 text-sm font-bold border border-amber-600 transition shadow-lg shrink-0">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                `;
                reviewGrid.appendChild(card);
            });

            document.getElementById('dictationReviewModal').classList.remove('hidden');
        }

        async function getJyutping(char) {
            try {
                const res = await fetch(`https://words.hk/api/v1/words/?q=${encodeURIComponent(char)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0 && data[0].jyutping) return data[0].jyutping;
                }
            } catch (e) { console.log(e); }
            return "---";
        }

        window.speakCantonese = function(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK';
                window.speechSynthesis.speak(utterance);
            }
        };

        function endGame(isWin) {
            document.getElementById('pauseGameBtn').classList.add('hidden');
            document.getElementById('gameOverTitle').textContent = isWin ? "水 鄉 大 捷" : "城 關 告 急";
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalCombo').textContent = maxCombo;
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        function startWordBankSession(bank) {
            wordBank = [...bank];
            if (isRandomOrder) wordBank.sort(() => Math.random() - 0.5);
            dictationResults = [];
            currentWordIndex = 0;
            score = 0;
            combo = 0;
            hp = 100;
            
            document.getElementById('pauseGameBtn').classList.remove('hidden');
            loadCurrentCharacter();
        }

        function loadCurrentCharacter() {
            const char = wordBank[currentWordIndex];
            document.getElementById('wordIndexTag').textContent = `目標 ${currentWordIndex + 1} / ${wordBank.length}`;
            getJyutping(char).then(jp => document.getElementById('jyutpingText').textContent = jp);
            initHanziWriter(char);
        }

        // --- 初始化事件 ---
        window.addEventListener('DOMContentLoaded', () => {
            const guidedBtn = document.getElementById('startModeGuidedBtn');
            const quizBtn = document.getElementById('startModeQuizBtn');
            guidedBtn.onclick = () => {
                isGuidedMode = true;
                guidedBtn.className = "px-3 py-1.5 rounded text-xs font-bold bg-amber-500 text-black shadow";
                quizBtn.className = "px-3 py-1.5 rounded text-xs font-bold bg-slate-700 text-gray-300 border border-slate-600 hover:text-amber-200";
            };
            quizBtn.onclick = () => {
                isGuidedMode = false;
                quizBtn.className = "px-3 py-1.5 rounded text-xs font-bold bg-amber-500 text-black shadow";
                guidedBtn.className = "px-3 py-1.5 rounded text-xs font-bold bg-slate-700 text-gray-300 border border-slate-600 hover:text-amber-200";
            };

            const seqBtn = document.getElementById('orderSequentialBtn');
            const randBtn = document.getElementById('orderRandomBtn');
            seqBtn.onclick = () => {
                isRandomOrder = false;
                seqBtn.className = "px-3 py-1.5 rounded text-xs font-bold bg-amber-500 text-black shadow";
                randBtn.className = "px-3 py-1.5 rounded text-xs font-bold bg-slate-700 text-gray-300 border border-slate-600 hover:text-amber-200";
            };
            randBtn.onclick = () => {
                isRandomOrder = true;
                randBtn.className = "px-3 py-1.5 rounded text-xs font-bold bg-amber-500 text-black shadow";
                seqBtn.className = "px-3 py-1.5 rounded text-xs font-bold bg-slate-700 text-gray-300 border border-slate-600 hover:text-amber-200";
            };

            let activeGradeKey = null;
            const gradeBtns = document.querySelectorAll('.grade-btn');
            gradeBtns.forEach(btn => {
                btn.onclick = (e) => {
                    activeGradeKey = e.currentTarget.getAttribute('data-grade');
                    const vocab = gradeVocabularies[activeGradeKey];
                    if (vocab) {
                        const sampleWords = getRandomWordsFromPool(vocab.pool, 10);
                        document.getElementById('parentCustomInput').value = sampleWords.join(' ');
                        gradeBtns.forEach(b => b.className = "grade-btn px-2 py-1.5 rounded bg-slate-700 text-gray-300 text-[11px] font-bold border border-slate-600 hover:border-amber-400 hover:text-amber-300 transition text-center leading-tight");
                        e.currentTarget.className = "grade-btn px-2 py-1.5 rounded bg-amber-500 text-black text-[11px] font-bold transition text-center leading-tight";
                    }
                };
            });

            document.getElementById('presetBtn').onclick = () => {
                document.getElementById('parentCustomInput').value = "學 習 努 力 香 港";
            };

            ['heroPhotoInput', 'modalHeroPhotoInput'].forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = evt => {
                                customHeroImageBase64 = evt.target.result;
                                document.getElementById('heroImgEl').src = customHeroImageBase64;
                                document.getElementById('resetHeroPhotoBtn').classList.remove('hidden');
                            };
                            reader.readAsDataURL(file);
                        }
                    });
                }
            });

            ['enemyPhotoInput', 'modalEnemyPhotoInput'].forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = evt => {
                                customEnemyImageBase64 = evt.target.result;
                                updateEnemyUI();
                                document.getElementById('resetEnemyPhotoBtn').classList.remove('hidden');
                            };
                            reader.readAsDataURL(file);
                        }
                    });
                }
            });

            document.getElementById('animateBtn').onclick = () => writer?.animateCharacter();
            document.getElementById('eraserBtn').onclick = () => clearDictationCanvas();
            document.getElementById('submitQuizBtn').onclick = () => evaluateDictation();
            document.getElementById('speakBtn').onclick = () => speakCantonese(wordBank[currentWordIndex]);

            document.getElementById('startGameBtn').onclick = () => {
                const val = document.getElementById('parentCustomInput').value.trim();
                if (val) {
                    originalWordBank = val.replace(/[^\u4e00-\u9fa5]/g, '').split('');
                } else {
                    originalWordBank = gradeVocabularies['P1'].pool.slice(0, 5);
                }
                
                if (originalWordBank.length > 0) {
                    document.getElementById('startModal').classList.add('hidden');
                    startWordBankSession(originalWordBank);
                } else {
                    window.showToast("請輸入有效中文字！");
                }
            };

            document.getElementById('reviewRetryAllBtn').onclick = () => {
                document.getElementById('dictationReviewModal').classList.add('hidden');
                startWordBankSession(originalWordBank);
            };
            document.getElementById('reviewRetryErrorsBtn').onclick = () => {
                const wrongs = dictationResults.filter(r => !r.pass).map(r => r.char);
                if (wrongs.length === 0) return window.showToast("全部正確！");
                document.getElementById('dictationReviewModal').classList.add('hidden');
                startWordBankSession(wrongs);
            };
            document.getElementById('reviewHomeBtn').onclick = () => {
                document.getElementById('dictationReviewModal').classList.add('hidden');
                document.getElementById('startModal').classList.remove('hidden');
            };
            
            document.getElementById('playAgainBtn').onclick = () => {
                document.getElementById('gameOverModal').classList.add('hidden');
                document.getElementById('startModal').classList.remove('hidden');
            };

            document.getElementById('pauseGameBtn').onclick = () => {
                document.getElementById('pauseModal').classList.remove('hidden');
                if (!isGuidedMode) document.getElementById('pauseSurrenderBtn').classList.remove('hidden');
            };
            document.getElementById('pauseResumeBtn').onclick = () => document.getElementById('pauseModal').classList.add('hidden');
            document.getElementById('pauseHomeBtn').onclick = () => {
                document.getElementById('pauseModal').classList.add('hidden');
                document.getElementById('pauseGameBtn').classList.add('hidden');
                document.getElementById('startModal').classList.remove('hidden');
            };
            document.getElementById('pauseSurrenderBtn').onclick = () => {
                document.getElementById('pauseModal').classList.add('hidden');
                showDictationReviewModal();
            };

            document.getElementById('openSaveModalBtn').onclick = () => document.getElementById('saveModal').classList.remove('hidden');
            document.getElementById('closeSaveModalBtn').onclick = () => document.getElementById('saveModal').classList.add('hidden');
            document.getElementById('openLoadModalBtn').onclick = () => {
                if(window.renderSaveSlotsList) window.renderSaveSlotsList();
                document.getElementById('loadModal').classList.remove('hidden');
            };
            document.getElementById('closeLoadModalBtn').onclick = () => document.getElementById('loadModal').classList.add('hidden');
        });
    </script>
</body>
</html>
